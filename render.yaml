services:
  - type: web
    name: rama-store
    env: static
    buildCommand: echo "Prebuilt Flutter Web App"
    staticPublishPath: ./rama_store_app/build/web
    routes:
      - type: rewrite
        source: /downloads/*
        destination: /downloads/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /downloads/*.apk
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*.apk
        name: Content-Disposition
        value: attachment; filename="rama-store-app.apk"

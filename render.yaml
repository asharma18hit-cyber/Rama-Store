services:
  - type: web
    name: rama-store
    env: static
    buildCommand: echo "Prebuilt Flutter Web App"
    staticPublishPath: ./rama_store_app/build/web
    routes:
      - type: rewrite
        source: /downloads/rama-store-app.apksvg
        destination: /downloads/rama-store-app.apk
      - type: rewrite
        source: /downloads/*
        destination: /downloads/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /downloads/*.apk
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*.apk
        name: Content-Disposition
        value: attachment; filename="rama-store-app.apk"

  - type: web
    name: rama-store-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_OTP_EXPIRY
        value: "5"
      - key: MSG91_OTP_LENGTH
        value: "6"

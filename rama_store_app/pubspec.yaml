name: rama_store_app
description: "Rama Store Native Mobile Application for Android and iOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation & Deep Linking
  go_router: ^12.1.3
  
  # Networking & HTTP
  dio: ^5.4.0
  
  # Local Storage & Caching
  shared_preferences: ^2.2.2
  
  # UI & Media
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  url_launcher: ^6.2.5
  image_picker: ^1.1.2
  # Firebase Core, Auth, Firestore, Storage & App Check
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_app_check: ^0.3.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

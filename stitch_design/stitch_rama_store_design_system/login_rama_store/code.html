<button class="w-full h-14 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm group" type="submit">
<span>Get OTP</span>
<span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>

<!-- Divider -->

<!-- Simple Feedback Logic -->
<script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined">sync</span>`;
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                btn.innerHTML = `OTP Sent!`;
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-secondary');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-secondary', 'opacity-80', 'pointer-events-none');
                    btn.classList.add('bg-primary');
                }, 2000);
            }, 1200);
        });
    </script>

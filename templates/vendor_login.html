<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Login - Samaur Mart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=20261030_v8">

    <style>
        :root {
            --v-bg: #030712;
            --v-card: rgba(15, 23, 42, 0.92);
            --v-border: rgba(184, 137, 43, 0.3);
            --gold-accent: #b8892b;
            --gold-hover: #e5ab37;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--v-bg);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(184, 137, 43, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 45%);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .vendor-auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--v-card);
            border: 1px solid var(--v-border);
            border-radius: 16px;
            padding: 2.75rem 2.25rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.8), 0 0 45px rgba(184, 137, 43, 0.15);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .vendor-logo-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .vendor-brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            background: rgba(184, 137, 43, 0.15);
            border: 1px solid rgba(184, 137, 43, 0.35);
            border-radius: 9999px;
            font-size: 0.8rem;
            color: #fbbf24;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .vendor-title {
            font-size: 1.85rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            color: #f8fafc;
        }

        .vendor-title span { color: var(--gold-accent); }
        .vendor-sub { color: #94a3b8; font-size: 0.925rem; margin: 0; }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            box-sizing: border-box;
            background: #090f1d;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 0.85rem 1rem;
            color: #f8fafc;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold-accent);
            box-shadow: 0 0 0 3px rgba(184, 137, 43, 0.2);
        }

        .btn-vendor-submit {
            width: 100%;
            background: linear-gradient(135deg, #b8892b, #936b1d);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 0.95rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(184, 137, 43, 0.35);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-vendor-submit:hover {
            background: linear-gradient(135deg, #d49e32, #b8892b);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(184, 137, 43, 0.45);
        }

        .btn-vendor-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .vendor-alert {
            padding: 0.85rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            display: none;
            line-height: 1.4;
        }

        .vendor-alert.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            display: block;
        }

        .vendor-alert.info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            display: block;
        }

        .vendor-alert.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
            display: block;
        }

        .vendor-footer-links {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .vendor-footer-links a {
            color: #fbbf24;
            text-decoration: none;
            font-weight: 600;
        }

        .vendor-footer-links a:hover {
            text-decoration: underline;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.88);
            backdrop-filter: blur(12px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .modal-card {
            background: rgba(13, 21, 39, 0.98);
            border: 1px solid var(--v-border);
            border-radius: 16px;
            padding: 2.25rem 2rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="vendor-auth-card">
        <div class="vendor-logo-header">
            <div class="vendor-brand-badge">🏪 Merchant Portal</div>
            <h1 class="vendor-title">Samaur <span>Mart</span></h1>
            <p class="vendor-sub">Sign in to manage your store, products and orders</p>
        </div>

        <div id="vendor-alert-box" class="vendor-alert"></div>

        <!-- Login Form -->
        <form id="form-vendor-login" onsubmit="handleVendorLogin(event)">
            <div class="form-group">
                <label class="form-label" for="vendor-id-input">Business Email or 10-Digit Mobile</label>
                <input
                    type="text"
                    id="vendor-id-input"
                    class="form-input"
                    placeholder="e.g. rahul@sharmastore.com or 9876543210"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label class="form-label" for="vendor-pass-input" style="margin-bottom: 0;">Password</label>
                    <a href="javascript:void(0)" onclick="openForgotPasswordModal()" style="font-size: 0.8rem; color: #fbbf24; text-decoration: none;">Forgot Password?</a>
                </div>
                <input
                    type="password"
                    id="vendor-pass-input"
                    class="form-input"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="btn-vendor-login" class="btn-vendor-submit">
                <span>Sign In to Vendor Dashboard →</span>
            </button>
        </form>

        <div class="vendor-footer-links">
            <p style="margin: 0 0 0.5rem 0;">New seller on Samaur Mart? <a href="/vendor/register">Register your store</a></p>
            <p style="margin: 0;"><a href="/store" style="color: #94a3b8; font-weight: normal;">← Return to Store</a></p>
        </div>
    </div>

    <!-- FORGOT PASSWORD MODAL -->
    <div id="modal-forgot-pwd" class="modal-overlay">
        <div class="modal-card">
            <h2 style="font-size: 1.4rem; color: #f8fafc; margin: 0 0 0.5rem 0;">Reset Password</h2>
            <p style="font-size: 0.88rem; color: #94a3b8; margin: 0 0 1.25rem 0;">
                Enter your registered mobile or email to receive a password reset code.
            </p>

            <div id="forgot-alert-box" class="vendor-alert"></div>

            <div id="forgot-step-1">
                <div class="form-group">
                    <input type="text" id="forgot-id-input" class="form-input" placeholder="Registered mobile or email">
                </div>
                <button type="button" class="btn-vendor-submit" onclick="requestPasswordResetOtp()">
                    Send Reset Code
                </button>
            </div>

            <div id="forgot-step-2" style="display: none;">
                <div class="form-group">
                    <input type="text" id="forgot-otp-input" class="form-input" placeholder="6-Digit Reset Code" maxlength="6" style="text-align: center; letter-spacing: 0.2em; font-family: 'IBM Plex Mono', monospace; font-size: 1.3rem;">
                </div>
                <div class="form-group">
                    <input type="password" id="forgot-new-pass" class="form-input" placeholder="New Password (min 6 chars)" minlength="6">
                </div>
                <button type="button" class="btn-vendor-submit" onclick="submitPasswordReset()">
                    Update Password
                </button>
            </div>

            <div style="margin-top: 1.25rem;">
                <a href="javascript:void(0)" onclick="closeForgotPasswordModal()" style="color: #94a3b8; font-size: 0.85rem; text-decoration: none;">Close</a>
            </div>
        </div>
    </div>

    <script>
        function showAlert(msg, type = 'error') {
            const alertBox = document.getElementById('vendor-alert-box');
            alertBox.textContent = msg;
            alertBox.className = `vendor-alert ${type}`;
            alertBox.style.display = 'block';
        }

        async function handleVendorLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('vendor-alert-box');
            const submitBtn = document.getElementById('btn-vendor-login');
            alertBox.style.display = 'none';

            const emailOrPhone = document.getElementById('vendor-id-input').value.trim();
            const password = document.getElementById('vendor-pass-input').value;

            if (!emailOrPhone || !password) {
                showAlert('Please enter your email or phone and password.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Signing In...</span>';

            try {
                const res = await fetch('/api/vendor/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email_or_phone: emailOrPhone, password: password })
                });

                const data = await res.json();
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In to Vendor Dashboard →</span>';

                if (res.ok && data.success && data.token) {
                    localStorage.setItem('vendor_token', data.token);
                    localStorage.setItem('vendor_user', JSON.stringify(data.vendor));
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/vendor';
                    }, 500);
                } else if (res.status === 403 && data.status === 'submitted') {
                    showAlert(data.error || 'Your application is under review by the store owner. You will be able to log in once approved.', 'info');
                } else {
                    showAlert(data.error || 'Invalid credentials. Please verify and try again.');
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In to Vendor Dashboard →</span>';
                showAlert('Connection error: ' + err.message);
            }
        }

        function openForgotPasswordModal() {
            document.getElementById('modal-forgot-pwd').style.display = 'flex';
            document.getElementById('forgot-alert-box').style.display = 'none';
            document.getElementById('forgot-step-1').style.display = 'block';
            document.getElementById('forgot-step-2').style.display = 'none';
        }

        function closeForgotPasswordModal() {
            document.getElementById('modal-forgot-pwd').style.display = 'none';
        }

        async function requestPasswordResetOtp() {
            const id = document.getElementById('forgot-id-input').value.trim();
            const alertBox = document.getElementById('forgot-alert-box');
            if (!id) {
                alertBox.textContent = 'Please enter your mobile or email.';
                alertBox.className = 'vendor-alert error';
                alertBox.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/vendor/forgot-password-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email_or_phone: id })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    alertBox.textContent = data.message || 'Reset code sent to your phone/email.';
                    alertBox.className = 'vendor-alert success';
                    alertBox.style.display = 'block';
                    document.getElementById('forgot-step-1').style.display = 'none';
                    document.getElementById('forgot-step-2').style.display = 'block';
                } else {
                    alertBox.textContent = data.error || 'Account not found.';
                    alertBox.className = 'vendor-alert error';
                    alertBox.style.display = 'block';
                }
            } catch (e) {
                alertBox.textContent = 'Connection error: ' + e.message;
                alertBox.className = 'vendor-alert error';
                alertBox.style.display = 'block';
            }
        }

        async function submitPasswordReset() {
            const id = document.getElementById('forgot-id-input').value.trim();
            const otp = document.getElementById('forgot-otp-input').value.trim();
            const newPass = document.getElementById('forgot-new-pass').value;
            const alertBox = document.getElementById('forgot-alert-box');

            if (!otp || !newPass || newPass.length < 6) {
                alertBox.textContent = 'Enter the 6-digit code and a new password (min. 6 chars).';
                alertBox.className = 'vendor-alert error';
                alertBox.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/api/vendor/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email_or_phone: id, otp: otp, new_password: newPass })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    alertBox.textContent = 'Password reset successfully! You can now log in.';
                    alertBox.className = 'vendor-alert success';
                    alertBox.style.display = 'block';
                    setTimeout(() => {
                        closeForgotPasswordModal();
                        showAlert('Password reset successfully! Please sign in with your new password.', 'success');
                    }, 1500);
                } else {
                    alertBox.textContent = data.error || 'Failed to reset password.';
                    alertBox.className = 'vendor-alert error';
                    alertBox.style.display = 'block';
                }
            } catch (e) {
                alertBox.textContent = 'Connection error: ' + e.message;
                alertBox.className = 'vendor-alert error';
                alertBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
